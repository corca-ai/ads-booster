[project]
name = "trace-appium-capture"
version = "0.5.1"
description = "On-premises Trace Marketing Agent Service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ddgs>=9,<10",
    "httpx2[brotli,http2,zstd]>=0.1",
    "jsonschema>=4.23,<5",
    "Pillow>=11,<13",
    "pydantic>=2.11,<3",
    "pypdf>=6.17,<7",
    "typer>=0.16,<1",
    "tzdata>=2026.3",
]

[project.scripts]
trace-marketing = "ads_booster.cli.marketing:app"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "types-Pillow>=10,<13",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_booster"]

[tool.hatch.build.targets.wheel.force-include]
"docs/operations/agent-server/slack-app-bootstrap-manifest.json" = "ads_booster/server_assets/slack-app-bootstrap-manifest.json"
"docs/operations/agent-server/slack-app-manifest.json" = "ads_booster/server_assets/slack-app-manifest.json"
"docs/operations/agent-server/trace-marketing.service" = "ads_booster/server_assets/trace-marketing.service"
"docs/operations/agent-server/trace-marketing-update.service" = "ads_booster/server_assets/trace-marketing-update.service"
"docs/operations/agent-server/trace-marketing-update.timer" = "ads_booster/server_assets/trace-marketing-update.timer"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportCallInDefaultInitializer = "none"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
exclude = [".omo"]

[tool.ruff.per-file-target-version]
"docs/operations/agent-server/agent-manager.py" = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"src/ads_booster/transport/http.py" = ["D105", "D107"]
"src/ads_booster/agent/runtime.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/contracts/feature_launch_evidence_brief.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/contracts/planning_projections.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/evaluation/decision_quality.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/evaluation/dynamic_research_canary.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/evaluation/dynamic_research_canary_corpus.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/evaluation/experiment_evaluation.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/evaluation/marketing_os_scorecard.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/evaluation/marketing_os_scorecard_corpus.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/research/dynamic_evidence_research.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/research/evidence_research_operator.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/workflows/feature_launch_operator.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/cli/marketing.py" = ["EM102", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
