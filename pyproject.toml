[project]
name = "trace-appium-capture"
version = "0.4.17"
description = "Codex-driven Appium worker for verified Trace marketing captures"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Appium-Python-Client>=5.1.1,<6",
    "ddgs>=9,<10",
    "httpx2[brotli,http2,zstd]>=0.1",
    "Pillow>=11,<13",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[project.scripts]
trace-marketing = "ads_booster.cli.marketing:app"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "types-Pillow>=10,<13",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_booster"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportCallInDefaultInitializer = "none"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
exclude = [".omo"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]
"src/ads_booster/search/image/providers.py" = ["S603"]
"src/ads_booster/transport/http.py" = ["D105", "D107"]
"src/ads_booster/marketing/*.py" = ["D107", "EM101", "EM102", "TC001", "TRY003", "TRY004"]
"src/ads_booster/cli/marketing.py" = ["EM102", "TRY003"]
"tests/cli/test_installer.py" = ["S603"]
"scripts/bootstrap-mac-worker.py" = [
    "ANN",
    "ARG001",
    "C901",
    "EM101",
    "EM102",
    "EM103",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PTH105",
    "RUF005",
    "S603",
    "S607",
    "T201",
    "TRY003",
    "UP032",
]
"tests/search/test_web_image_search_providers.py" = ["FLY002", "Q003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
