name: Deploy Cloudflare marketing control plane

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy-cloudflare.yml
      - cloudflare/**
      - src/ads_booster/assets/context/**
      - src/ads_booster/web/static/**
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-cloudflare.yml
      - cloudflare/**
      - src/ads_booster/assets/context/**
      - src/ads_booster/web/static/**
  workflow_dispatch:

concurrency:
  group: cloudflare-marketing-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Worker checks
        run: npm run check

  deploy:
    name: Migrate, deploy, and verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      TRACE_DEPLOY_SHA: ${{ github.sha }}
      TRACE_MARKETING_HEALTH_URL: ${{ vars.TRACE_MARKETING_HEALTH_URL }}

    steps:
      - name: Check out the merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN Actions secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CF_D1_DATABASE_ID:?missing CF_D1_DATABASE_ID repository variable}"
          : "${TRACE_MARKETING_HEALTH_URL:?missing TRACE_MARKETING_HEALTH_URL repository variable}"

      - name: Install locked dependencies
        run: npm ci

      - name: Render production configuration
        run: npm run config

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npm run deploy

      - name: Verify deployed health
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          read_exact_health() {
            local url="$1"
            local response=""
            for attempt in {1..8}; do
              response="$(curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --retry 3 --retry-all-errors --retry-delay 3 \
                "$url")"
              if jq -e --arg sha "$TRACE_DEPLOY_SHA" \
                '.ok == true and .commit_sha == $sha' <<<"$response" >/dev/null; then
                printf '%s\n' "$response"
                return 0
              fi
              sleep 5
            done
            echo "health endpoint did not expose deployed SHA $TRACE_DEPLOY_SHA: $url" >&2
            return 1
          }
          response="$(read_exact_health "$TRACE_MARKETING_HEALTH_URL")"

          workspace_url="${TRACE_MARKETING_HEALTH_URL%/health}/"
          workspace="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "$workspace_url")"
          test "${workspace#*data-workspace-live}" != "$workspace"
          test "${workspace#*data-context-select}" != "$workspace"
          test "${workspace#*data-worker-title}" != "$workspace"
          test "${workspace#*워크스페이스 접속 ID}" = "$workspace"

          session="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "${workspace_url}api/auth/session")"
          node -e '
            const session = JSON.parse(process.argv[1]);
            if (session.member_id !== "public" || session.workspace_id !== "cloudflare:trace_demo_kr" || session.account_id !== "trace_demo_kr") {
              process.exit(1);
            }
          ' "$session"

          contexts="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "${workspace_url}api/context-profiles")"
          node -e '
            const profiles = JSON.parse(process.argv[1]);
            if (!Array.isArray(profiles) || profiles.length === 0 || !profiles.some((profile) => profile.is_default)) {
              process.exit(1);
            }
          ' "$contexts"

          workers="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "${workspace_url}api/workers/status")"
          node -e '
            const status = JSON.parse(process.argv[1]);
            const allowed = new Set(["not_configured", "ready", "degraded", "offline"]);
            if (!allowed.has(status.status) || !status.counts || !Array.isArray(status.workers)) {
              process.exit(1);
            }
            const topKeys = ["counts", "online_window_seconds", "status", "workers"];
            const countKeys = ["busy", "draining", "online", "ready", "registered"];
            const workerKeys = ["display_name", "pool", "status"];
            const workerStatuses = new Set(["ready", "busy", "degraded", "draining", "offline"]);
            const exactKeys = (value, allowedKeys) =>
              JSON.stringify(Object.keys(value).sort()) === JSON.stringify(allowedKeys);
            const nonNegativeInteger = (value) => Number.isInteger(value) && value >= 0;
            const validWorker = (worker) =>
              exactKeys(worker, workerKeys) &&
              typeof worker.display_name === "string" && worker.display_name.length > 0 &&
              typeof worker.pool === "string" && worker.pool.length > 0 &&
              workerStatuses.has(worker.status);
            if (!exactKeys(status, topKeys) || !exactKeys(status.counts, countKeys) ||
                !nonNegativeInteger(status.online_window_seconds) ||
                Object.values(status.counts).some((value) => !nonNegativeInteger(value)) ||
                status.workers.some((worker) => !validWorker(worker))) {
              process.exit(1);
            }
          ' "$workers"

          custom_health="$(read_exact_health "https://workspace.borca.ai/health")"
